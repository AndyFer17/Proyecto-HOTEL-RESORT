name: Calidad y pruebas de Clientes
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  clientes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: clientes
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: clientes_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clientes -d clientes_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://clientes:ci-only-password@127.0.0.1:5432/clientes_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --prod --audit-level=high
      - run: node scripts/setup-dev.mjs
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - run: curl --fail --retry 20 --retry-delay 2 --retry-all-errors http://127.0.0.1:3001/health/ready
      - run: node scripts/smoke.mjs
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
