pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server_tokens off;
  client_max_body_size 16k;
  proxy_connect_timeout 3s;
  proxy_read_timeout 15s;
  proxy_set_header Host $host;
  proxy_set_header X-Request-Id $http_x_request_id;
  server {
    listen 8080;
    location = /health/ready {
      default_type application/json;
      return 200 '{"servicio":"gateway","estado":"OK"}';
    }
    # La identidad de servicio solo se usa dentro de la red de Compose.
    location ^~ /api/v1/interno { return 404; }
    location ~ ^/api/v1/(clientes|auth)(/|$) { proxy_pass http://clientes:3001; }
    location = /.well-known/jwks.json { proxy_pass http://clientes:3001; }
    location ~ ^/api/v1/habitaciones(/|$) { proxy_pass http://habitaciones:3002; }
    location ~ ^/api/v1/reservas(/|$) { proxy_pass http://reservas:3003; }
    location ~ ^/api/v1/(cuentas|pagos|notificaciones)(/|$) { proxy_pass http://pagos:3004; }
    location / { return 404; }
  }
}
